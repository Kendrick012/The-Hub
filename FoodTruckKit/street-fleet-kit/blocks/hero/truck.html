<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Preview: Hero — Truck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
    --bg:#201E1B; --bg-alt:#2A2723; --text:#EFE7D8; --text-dim:rgba(239,231,216,0.6);
    --accent:#E8A93B; --accent-2:#2F6F6E; --line:rgba(239,231,216,0.16);
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg); color:var(--text); font-family:'Rubik', sans-serif; font-weight:300; line-height:1.6;}
h1,h2,h3{font-family:'Bungee', sans-serif; font-weight:400;}
h1,h2,h3{text-transform:uppercase;}
.mono{font-family:'Space Mono', monospace;}
a{color:inherit; text-decoration:none;}
.wrap{max-width:1080px; margin:0 auto; padding:0 32px;}

/* COPY START */
.hero-truck{min-height:96vh; display:flex; flex-direction:column; justify-content:center; padding:140px 40px 70px;}
.hero-truck .eyebrow{display:inline-block; font-size:12px; letter-spacing:0.15em; text-transform:uppercase; color:var(--bg); background:var(--accent); padding:6px 14px; margin-bottom:28px; transform:rotate(-2deg); font-family:var(--mono);}
.hero-truck h1{font-size:clamp(46px,9vw,110px); line-height:0.94;}
.hero-truck h1 .hl{color:var(--accent-2);}
.hero-truck p{max-width:440px; margin-top:28px; color:var(--text-dim); font-size:16.5px; text-transform:none;}
.hero-truck .row{display:flex; gap:16px; margin-top:38px; flex-wrap:wrap;}
.hero-truck .btn{display:inline-block; padding:16px 34px; font-size:13px; letter-spacing:0.08em; text-transform:uppercase; border:2px solid var(--accent); font-family:var(--mono);}
.hero-truck .solid{background:var(--accent); color:var(--bg); font-weight:700;}
.hero-truck .outline{color:var(--text); border-color:var(--text);}
/* COPY END */
</style>
</head>
<body>

<!-- COPY START -->
<section class="hero-truck">
  <div class="wrap">
    <span class="eyebrow">EDIT ME - Parked somewhere new every day</span>
    <h1>EDIT ME - Street food.<br><span class="hl">No stove required.</span></h1>
    <p>EDIT ME - A short pitch for the business.</p>
    <div class="row">
      <a class="btn solid" href="#route">EDIT ME - Find the Truck</a>
      <a class="btn outline" href="#menu">EDIT ME - See Menu</a>
    </div>
  </div>
</section>
<!-- COPY END -->

</body>
</html>
