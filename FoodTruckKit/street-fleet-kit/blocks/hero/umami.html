<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Preview: hero — Umami (Night Market)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Antique&family=Manrope:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{ --bg:#191423; --bg-alt:#221B30; --text:#F3EDE4; --text-dim:rgba(243,237,228,0.6); --accent:#E8A05C; --accent-2:#C8462E; --line:rgba(243,237,228,0.14); }
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg); color:var(--text); font-family:'Manrope',sans-serif; font-weight:300; line-height:1.7;}
h1,h2,h3{font-family:'Zen Antique',serif; font-weight:400;}
a{color:inherit; text-decoration:none;}
.wrap{max-width:1060px; margin:0 auto; padding:0 32px;}

/* COPY START */
/* centered night-market hero; pairs with ornaments/lantern.html placed
   inside .hero-umami above the eyebrow (see markup slot comment). */
.hero-umami{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:120px 32px 70px;}
.hero-umami .eyebrow{font-size:12px; letter-spacing:0.35em; text-transform:uppercase; color:var(--accent); margin-bottom:20px; animation:softFade 1s ease .3s both;}
.hero-umami h1{font-size:clamp(38px,6.5vw,72px); line-height:1.1; max-width:640px; animation:softFade 1.1s ease .5s both;}
.hero-umami h1 em{color:var(--accent-2); font-style:normal;}
.hero-umami p{max-width:440px; margin:22px auto 0; color:var(--text-dim); animation:softFade 1.1s ease .75s both;}
.hero-umami .btn{display:inline-block; margin-top:34px; padding:15px 40px; border:1px solid var(--accent); color:var(--accent); font-size:13px; letter-spacing:0.14em; text-transform:uppercase; transition:all .3s ease; animation:softFade 1.1s ease 1s both;}
.hero-umami .btn:hover{background:var(--accent); color:var(--bg);}
@keyframes softFade{from{opacity:0;}to{opacity:1;}}
/* COPY END */
@media(prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important;}}
</style>
</head>
<body>

<!-- COPY START -->
<section class="hero-umami">
  <!-- OPTIONAL: paste the lantern from ornaments/lantern.html here, above the eyebrow -->
  <span class="eyebrow">EDIT ME - Tagline</span>
  <h1>EDIT ME - Headline with an <em>accent word.</em></h1>
  <p>EDIT ME - One or two atmospheric sentences about the truck.</p>
  <a class="btn" href="#find">EDIT ME - Button text</a>
</section>
<!-- COPY END -->

</body>
</html>
