<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Preview: hero — Sprout (Fresh & Light)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{ --bg:#EAF2E4; --bg-alt:#F6FAF2; --text:#22301F; --text-dim:rgba(34,48,31,0.65); --accent:#3E7C4F; --accent-2:#E86A4E; --line:rgba(34,48,31,0.14); }
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg); color:var(--text); font-family:'Nunito',sans-serif; font-weight:400; line-height:1.65;}
h1,h2,h3{font-family:'Fredoka',sans-serif; font-weight:600;}
a{color:inherit; text-decoration:none;}
.wrap{max-width:1060px; margin:0 auto; padding:0 32px;}

/* COPY START */
/* split hero; pairs with ornaments/wheel.html in the right column. */
.hero-sprout{min-height:96vh; display:flex; align-items:center; padding:130px 40px 60px;}
.hero-sprout .inner{display:grid; grid-template-columns:1.05fr 0.95fr; gap:50px; align-items:center; width:100%;}
.hero-sprout .badge{display:inline-block; background:#F2B33D; color:var(--text); font-weight:700; font-size:12px; letter-spacing:.06em; text-transform:uppercase; padding:7px 16px; border-radius:100px; margin-bottom:20px; animation:pop .5s cubic-bezier(.34,1.56,.64,1) .1s both;}
.hero-sprout h1{font-size:clamp(38px,6vw,66px); line-height:1.05; color:var(--accent); animation:fadeUp .7s ease .3s both;}
.hero-sprout h1 span{color:var(--accent-2);}
.hero-sprout p{max-width:420px; margin-top:20px; color:var(--text-dim); font-size:16.5px; animation:fadeUp .7s ease .5s both;}
.hero-sprout .btn{display:inline-block; margin-top:30px; padding:15px 36px; background:var(--accent); color:#fff; font-weight:700; font-size:14px; border-radius:100px; transition:transform .25s ease; animation:fadeUp .7s ease .7s both;}
.hero-sprout .btn:hover{transform:translateY(-3px);}
.hero-sprout .art{display:flex; justify-content:center;}
@keyframes fadeUp{from{opacity:0; transform:translateY(24px);}to{opacity:1; transform:none;}}
@keyframes pop{from{opacity:0; transform:scale(.7);}to{opacity:1; transform:scale(1);}}
@media(max-width:820px){.hero-sprout .inner{grid-template-columns:1fr;} .hero-sprout .art{display:none;}}
/* COPY END */
@media(prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important;}}
</style>
</head>
<body>

<!-- COPY START -->
<section class="hero-sprout">
  <div class="wrap inner">
    <div>
      <span class="badge">EDIT ME - Badge line</span>
      <h1>EDIT ME - Headline with a <span>highlight.</span></h1>
      <p>EDIT ME - One or two friendly sentences about the truck.</p>
      <a class="btn" href="#menu">EDIT ME - Button text</a>
    </div>
    <div class="art">
      <!-- OPTIONAL: paste the wheel from ornaments/wheel.html here -->
    </div>
  </div>
</section>
<!-- COPY END -->

</body>
</html>
