<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Preview: navbar — Umami (Night Market)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Antique&family=Manrope:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{ --bg:#191423; --bg-alt:#221B30; --text:#F3EDE4; --text-dim:rgba(243,237,228,0.6); --accent:#E8A05C; --accent-2:#C8462E; --line:rgba(243,237,228,0.14); }
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg); color:var(--text); font-family:'Manrope',sans-serif; font-weight:300; line-height:1.7;}
h1,h2,h3{font-family:'Zen Antique',serif; font-weight:400;}
a{color:inherit; text-decoration:none;}
.wrap{max-width:1060px; margin:0 auto; padding:0 32px;}

/* COPY START */
nav.nav-umami{position:fixed; top:0; left:0; right:0; z-index:50; display:flex; justify-content:space-between; align-items:center; padding:22px 36px; background:linear-gradient(to bottom, var(--bg), transparent);}
.nav-umami .logo{font-family:'Zen Antique',serif; font-size:19px;}
.nav-umami .logo em{color:var(--accent-2); font-style:normal;}
.nav-umami .links{display:flex; gap:28px; font-size:13px; letter-spacing:0.12em; text-transform:uppercase;}
.nav-umami .links a{opacity:.8;} .nav-umami .links a:hover{opacity:1; color:var(--accent);}
@media(max-width:760px){.nav-umami .links{display:none;}}
/* COPY END */
@media(prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important;}}
</style>
</head>
<body>

<!-- COPY START -->
<nav class="nav-umami">
  <a class="logo" href="#">EDIT ME <em>Name</em></a>
  <div class="links"><a href="#menu">Menu</a><a href="#find">Find Us</a><a href="#reviews">Reviews</a><a href="#contact">Contact</a></div>
</nav>
<!-- COPY END -->

</body>
</html>
