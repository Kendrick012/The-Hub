<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Preview: Navbar — Truck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
    --bg:#201E1B; --bg-alt:#2A2723; --text:#EFE7D8; --text-dim:rgba(239,231,216,0.6);
    --accent:#E8A93B; --accent-2:#2F6F6E; --line:rgba(239,231,216,0.16);
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg); color:var(--text); font-family:'Rubik', sans-serif; font-weight:300; line-height:1.6;}
h1,h2,h3{font-family:'Bungee', sans-serif; font-weight:400;}
h1,h2,h3{text-transform:uppercase;}
.mono{font-family:'Space Mono', monospace;}
a{color:inherit; text-decoration:none;}
.wrap{max-width:1080px; margin:0 auto; padding:0 32px;}

/* COPY START */
nav.nav-truck{position:fixed; top:0; left:0; right:0; z-index:50; display:flex; justify-content:space-between; align-items:center; padding:22px 40px; background:linear-gradient(to bottom, var(--bg), transparent);}
.nav-truck .logo{font-size:16px; color:var(--accent);}
.nav-truck .links{display:flex; gap:28px; font-size:12px; letter-spacing:0.06em; text-transform:uppercase; font-family:var(--mono, inherit);}
.nav-truck .links a{opacity:0.85; transition:opacity .2s;}
.nav-truck .links a:hover{opacity:1; color:var(--accent);}
@media(max-width:720px){.nav-truck .links{display:none;}}
/* COPY END */
</style>
</head>
<body>

<!-- COPY START -->
<nav class="nav-truck">
  <div class="logo">EDIT ME - CO.</div>
  <div class="links"><a href="#menu">Menu</a><a href="#route">Find Us</a><a href="#about">Story</a></div>
</nav>
<!-- COPY END -->

</body>
</html>
