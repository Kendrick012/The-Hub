<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Preview: map — Sprout (Fresh & Light)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{ --bg:#EAF2E4; --bg-alt:#F6FAF2; --text:#22301F; --text-dim:rgba(34,48,31,0.65); --accent:#3E7C4F; --accent-2:#E86A4E; --line:rgba(34,48,31,0.14); }
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg); color:var(--text); font-family:'Nunito',sans-serif; font-weight:400; line-height:1.65;}
h1,h2,h3{font-family:'Fredoka',sans-serif; font-weight:600;}
a{color:inherit; text-decoration:none;}
.wrap{max-width:1060px; margin:0 auto; padding:0 32px;}

/* COPY START */
.map-sprout{padding:90px 0; background:var(--bg-alt); border-top:1px solid var(--line); border-bottom:1px solid var(--line);}
.map-sprout .head{text-align:center; max-width:520px; margin:0 auto 50px;}
.map-sprout .head span{color:var(--accent-2); font-weight:700; font-size:13px; letter-spacing:.14em; text-transform:uppercase;}
.map-sprout .head h2{font-size:clamp(28px,4vw,42px); margin-top:10px; color:var(--accent);}
.map-sprout .head p{color:var(--text-dim); margin-top:10px; font-size:15px;}
.map-sprout .grid{display:grid; grid-template-columns:1.1fr 0.9fr; gap:40px; align-items:stretch;}
.map-sprout .frame{border-radius:20px; overflow:hidden; border:1px solid var(--line); min-height:340px;}
.map-sprout iframe{width:100%; height:100%; min-height:340px; border:0;}
.map-sprout .week{display:flex; flex-direction:column; gap:10px; justify-content:center;}
.map-sprout .wk{display:flex; justify-content:space-between; align-items:center; background:var(--bg); border-radius:14px; padding:15px 20px; font-size:14px;}
.map-sprout .wk.today{background:var(--accent); color:#fff;}
.map-sprout .wk .d{font-weight:800; text-transform:uppercase; font-size:12px; letter-spacing:.08em;}
.map-sprout .wk .t{color:var(--text-dim);}
.map-sprout .wk.today .t{color:rgba(255,255,255,0.85);}
@media(max-width:820px){.map-sprout .grid{grid-template-columns:1fr;}}
/* COPY END */
@media(prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important;}}
</style>
</head>
<body>

<!-- COPY START -->
<section class="map-sprout" id="find">
  <div class="wrap">
    <div class="head"><span>EDIT ME - Eyebrow</span><h2>EDIT ME - Where the truck is</h2><p>EDIT ME - One supporting line.</p></div>
    <div class="grid">
      <div class="frame">
        <iframe src="https://maps.google.com/maps?q=EDIT%20ME%20Address&z=14&output=embed" loading="lazy" title="Current location" referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>
      <div class="week">
        <div class="wk today"><span class="d">Today · EDIT ME</span><span class="t">EDIT ME - Location · Hours</span></div>
        <div class="wk"><span class="d">EDIT ME - Day</span><span class="t">EDIT ME - Location · Hours</span></div>
        <div class="wk"><span class="d">EDIT ME - Day</span><span class="t">EDIT ME - Location · Hours</span></div>
      </div>
    </div>
  </div>
</section>
<!-- COPY END -->

</body>
</html>
