<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Preview: map — Truck (Hot Plate)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{ --bg:#201E1B; --bg-alt:#2A2723; --text:#EFE7D8; --text-dim:rgba(239,231,216,0.6); --accent:#E8A93B; --accent-2:#2F6F6E; --line:rgba(239,231,216,0.16); }
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg); color:var(--text); font-family:'Rubik',sans-serif; font-weight:300; line-height:1.6;}
h1,h2,h3{font-family:'Bungee',sans-serif; text-transform:uppercase; font-weight:400;}
.mono{font-family:'Space Mono',monospace;}
a{color:inherit; text-decoration:none;}
.wrap{max-width:1060px; margin:0 auto; padding:0 32px;}

/* COPY START */
.map-truck{padding:90px 0; background:var(--bg-alt);}
.map-truck .head{margin-bottom:48px;}
.map-truck .head span{font-family:'Space Mono',monospace; font-size:12px; letter-spacing:.2em; color:var(--accent-2); text-transform:uppercase;}
.map-truck .head h2{font-size:clamp(28px,4.5vw,46px); margin-top:10px;}
.map-truck .grid{display:grid; grid-template-columns:0.9fr 1.1fr; gap:40px; align-items:stretch;}
.map-truck .frame{border-radius:8px; overflow:hidden; border:1px solid var(--line); min-height:340px;}
.map-truck iframe{width:100%; height:100%; min-height:340px; border:0; filter:grayscale(.2);}
.map-truck .stops{display:flex; flex-direction:column; gap:12px;}
.map-truck .stop{background:var(--bg); border-left:4px solid var(--accent-2); padding:16px 18px;}
.map-truck .stop.today{border-left-color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, var(--bg));}
.map-truck .stop .d{font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--text-dim);}
.map-truck .stop.today .d{color:var(--accent);}
.map-truck .stop .p{font-family:'Bungee',sans-serif; font-size:14px; margin-top:4px;}
.map-truck .stop .t{font-family:'Space Mono',monospace; font-size:12px; color:var(--text-dim); margin-top:2px;}
@media(max-width:820px){.map-truck .grid{grid-template-columns:1fr;}}
/* COPY END */
@media(prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important;}}
</style>
</head>
<body>

<!-- COPY START -->
<section class="map-truck" id="find">
  <div class="wrap">
    <div class="head"><span>EDIT ME - Eyebrow</span><h2>EDIT ME - Where We're Parked</h2></div>
    <div class="grid">
      <div class="stops">
        <div class="stop today"><div class="d">Today · EDIT ME</div><div class="p">EDIT ME - Location</div><div class="t">EDIT ME - Hours</div></div>
        <div class="stop"><div class="d">EDIT ME - Day</div><div class="p">EDIT ME - Location</div><div class="t">EDIT ME - Hours</div></div>
        <div class="stop"><div class="d">EDIT ME - Day</div><div class="p">EDIT ME - Location</div><div class="t">EDIT ME - Hours</div></div>
      </div>
      <div class="frame">
        <iframe src="https://maps.google.com/maps?q=EDIT%20ME%20Address&z=14&output=embed" loading="lazy" title="Current location" referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>
    </div>
  </div>
</section>
<!-- COPY END -->

</body>
</html>
