<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Preview: map — Umami (Night Market)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Antique&family=Manrope:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{ --bg:#191423; --bg-alt:#221B30; --text:#F3EDE4; --text-dim:rgba(243,237,228,0.6); --accent:#E8A05C; --accent-2:#C8462E; --line:rgba(243,237,228,0.14); }
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg); color:var(--text); font-family:'Manrope',sans-serif; font-weight:300; line-height:1.7;}
h1,h2,h3{font-family:'Zen Antique',serif; font-weight:400;}
a{color:inherit; text-decoration:none;}
.wrap{max-width:1060px; margin:0 auto; padding:0 32px;}

/* COPY START */
.map-umami{padding:90px 0; background:var(--bg-alt);}
.map-umami .head{text-align:center; margin-bottom:52px;}
.map-umami .head span{font-size:12px; letter-spacing:.3em; text-transform:uppercase; color:var(--accent);}
.map-umami .head h2{font-size:clamp(28px,4vw,44px); margin-top:12px;}
.map-umami .inner{display:grid; grid-template-columns:1fr 1fr; gap:40px; align-items:center;}
.map-umami .frame{border-radius:4px; overflow:hidden; border:1px solid var(--line);}
.map-umami iframe{width:100%; height:360px; border:0; filter:sepia(.15) contrast(1.05);}
.map-umami h3{font-size:20px; margin-bottom:14px;}
.map-umami .lede{color:var(--text-dim); font-size:14.5px; margin-bottom:20px;}
.map-umami .sched{border-top:1px solid var(--line);}
.map-umami .srow{display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--line); font-size:14px;}
.map-umami .srow .d{color:var(--accent); letter-spacing:.1em; text-transform:uppercase; font-size:12px;}
@media(max-width:820px){.map-umami .inner{grid-template-columns:1fr;}}
/* COPY END */
@media(prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important;}}
</style>
</head>
<body>

<!-- COPY START -->
<section class="map-umami" id="find">
  <div class="wrap">
    <div class="head"><span>EDIT ME - Eyebrow</span><h2>EDIT ME - Tonight's spot</h2></div>
    <div class="inner">
      <div>
        <h3>EDIT ME - Current location</h3>
        <p class="lede">EDIT ME - One line about how you announce spots.</p>
        <div class="sched">
          <div class="srow"><span class="d">EDIT ME - Days</span><span>EDIT ME - Location · Hours</span></div>
          <div class="srow"><span class="d">EDIT ME - Days</span><span>EDIT ME - Location · Hours</span></div>
          <div class="srow"><span class="d">EDIT ME - Days</span><span>EDIT ME - Closed note</span></div>
        </div>
      </div>
      <div class="frame">
        <iframe src="https://maps.google.com/maps?q=EDIT%20ME%20Address&z=15&output=embed" loading="lazy" title="Location tonight" referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>
    </div>
  </div>
</section>
<!-- COPY END -->

</body>
</html>
