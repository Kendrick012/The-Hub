<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Preview: info — Truck (Hot Plate)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{ --bg:#201E1B; --bg-alt:#2A2723; --text:#EFE7D8; --text-dim:rgba(239,231,216,0.6); --accent:#E8A93B; --accent-2:#2F6F6E; --line:rgba(239,231,216,0.16); }
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg); color:var(--text); font-family:'Rubik',sans-serif; font-weight:300; line-height:1.6;}
h1,h2,h3{font-family:'Bungee',sans-serif; text-transform:uppercase; font-weight:400;}
.mono{font-family:'Space Mono',monospace;}
a{color:inherit; text-decoration:none;}
.wrap{max-width:1060px; margin:0 auto; padding:0 32px;}

/* COPY START */
.info-truck{padding:90px 0; background:var(--bg-alt);}
.info-truck .head{margin-bottom:48px;}
.info-truck .head span{font-family:'Space Mono',monospace; font-size:12px; letter-spacing:.2em; color:var(--accent-2); text-transform:uppercase;}
.info-truck .head h2{font-size:clamp(28px,4.5vw,46px); margin-top:10px;}
.info-truck .grid{display:grid; grid-template-columns:1fr 1fr; gap:40px;}
.info-truck .card{background:var(--bg); border-radius:6px; padding:30px 28px;}
.info-truck .card h3{font-size:16px; margin-bottom:18px; color:var(--accent);}
.info-truck .row{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px dotted var(--line); font-size:14px;}
.info-truck .row:last-of-type{border-bottom:none;}
.info-truck .row span:first-child{color:var(--text-dim);}
.info-truck .row span:last-child{font-family:'Space Mono',monospace;}
.info-truck .btn{display:block; text-align:center; margin-top:20px; padding:15px; background:var(--accent); color:var(--bg); font-family:'Space Mono',monospace; font-size:13px; letter-spacing:.08em; text-transform:uppercase; font-weight:700; border:2px solid var(--accent); transition:transform .2s ease;}
.info-truck .btn:hover{transform:translateY(-3px);}
@media(max-width:820px){.info-truck .grid{grid-template-columns:1fr;}}
/* COPY END */
@media(prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important;}}
</style>
</head>
<body>

<!-- COPY START -->
<section class="info-truck" id="contact">
  <div class="wrap">
    <div class="head"><span>EDIT ME - Eyebrow</span><h2>Hours &amp; Contact</h2></div>
    <div class="grid">
      <div class="card">
        <h3>Business Hours</h3>
        <div class="row"><span>EDIT ME - Day(s)</span><span>EDIT ME - Hours</span></div>
        <div class="row"><span>EDIT ME - Day(s)</span><span>EDIT ME - Hours</span></div>
        <div class="row"><span>EDIT ME - Day(s)</span><span>EDIT ME - Hours</span></div>
      </div>
      <div class="card">
        <h3>Get In Touch</h3>
        <div class="row"><span>Phone / Text</span><span>EDIT ME</span></div>
        <div class="row"><span>Email</span><span>EDIT ME</span></div>
        <div class="row"><span>Instagram</span><span>EDIT ME</span></div>
        <a class="btn" href="mailto:EDIT-ME@example.com">EDIT ME - Email the Truck</a>
      </div>
    </div>
  </div>
</section>
<!-- COPY END -->

</body>
</html>
