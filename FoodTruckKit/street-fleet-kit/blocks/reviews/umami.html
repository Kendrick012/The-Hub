<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Preview: reviews — Umami (Night Market)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Antique&family=Manrope:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{ --bg:#191423; --bg-alt:#221B30; --text:#F3EDE4; --text-dim:rgba(243,237,228,0.6); --accent:#E8A05C; --accent-2:#C8462E; --line:rgba(243,237,228,0.14); }
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg); color:var(--text); font-family:'Manrope',sans-serif; font-weight:300; line-height:1.7;}
h1,h2,h3{font-family:'Zen Antique',serif; font-weight:400;}
a{color:inherit; text-decoration:none;}
.wrap{max-width:1060px; margin:0 auto; padding:0 32px;}

/* COPY START */
.reviews-umami{padding:90px 0;}
.reviews-umami .head{text-align:center; margin-bottom:40px;}
.reviews-umami .head span{font-size:12px; letter-spacing:.3em; text-transform:uppercase; color:var(--accent);}
.reviews-umami .head h2{font-size:clamp(28px,4vw,44px); margin-top:12px;}
.reviews-umami .quotes{max-width:640px; margin:0 auto;}
.reviews-umami .quote{text-align:center; padding:34px 0; border-bottom:1px solid var(--line);}
.reviews-umami .quote:last-child{border-bottom:none;}
.reviews-umami .stars{color:var(--accent); letter-spacing:4px; margin-bottom:14px;}
.reviews-umami .quote p{font-family:'Zen Antique',serif; font-size:18px; line-height:1.6;}
.reviews-umami .who{margin-top:12px; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--text-dim);}
/* COPY END */
@media(prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important;}}
</style>
</head>
<body>

<!-- COPY START -->
<section class="reviews-umami" id="reviews">
  <div class="wrap">
    <div class="head"><span>EDIT ME - Eyebrow</span><h2>Reviews</h2></div>
    <div class="quotes">
      <div class="quote"><div class="stars">&#9733;&#9733;&#9733;&#9733;&#9733;</div><p>"EDIT ME - A longer, atmospheric review quote."</p><div class="who">EDIT ME - Name</div></div>
      <div class="quote"><div class="stars">&#9733;&#9733;&#9733;&#9733;&#9733;</div><p>"EDIT ME - A longer, atmospheric review quote."</p><div class="who">EDIT ME - Name</div></div>
    </div>
  </div>
</section>
<!-- COPY END -->

</body>
</html>
