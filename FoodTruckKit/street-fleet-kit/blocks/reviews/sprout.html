<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Preview: reviews — Sprout (Fresh & Light)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{ --bg:#EAF2E4; --bg-alt:#F6FAF2; --text:#22301F; --text-dim:rgba(34,48,31,0.65); --accent:#3E7C4F; --accent-2:#E86A4E; --line:rgba(34,48,31,0.14); }
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg); color:var(--text); font-family:'Nunito',sans-serif; font-weight:400; line-height:1.65;}
h1,h2,h3{font-family:'Fredoka',sans-serif; font-weight:600;}
a{color:inherit; text-decoration:none;}
.wrap{max-width:1060px; margin:0 auto; padding:0 32px;}

/* COPY START */
.reviews-sprout{padding:90px 0;}
.reviews-sprout .head{text-align:center; max-width:520px; margin:0 auto 50px;}
.reviews-sprout .head span{color:var(--accent-2); font-weight:700; font-size:13px; letter-spacing:.14em; text-transform:uppercase;}
.reviews-sprout .head h2{font-size:clamp(28px,4vw,42px); margin-top:10px; color:var(--accent);}
.reviews-sprout .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:24px;}
.reviews-sprout .review{background:var(--bg-alt); border-radius:20px; padding:26px; border:1px solid var(--line);}
.reviews-sprout .stars{color:#F2B33D; letter-spacing:3px; margin-bottom:12px; font-size:15px;}
.reviews-sprout p{font-size:14px; color:var(--text-dim);}
.reviews-sprout .who{margin-top:14px; font-weight:800; font-size:13px; color:var(--accent);}
@media(max-width:820px){.reviews-sprout .grid{grid-template-columns:1fr;}}
/* COPY END */
@media(prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important;}}
</style>
</head>
<body>

<!-- COPY START -->
<section class="reviews-sprout" id="reviews">
  <div class="wrap">
    <div class="head"><span>EDIT ME - Eyebrow</span><h2>Reviews</h2></div>
    <div class="grid">
      <div class="review"><div class="stars">&#9733;&#9733;&#9733;&#9733;&#9733;</div><p>"EDIT ME - Review text."</p><div class="who">EDIT ME - Name</div></div>
      <div class="review"><div class="stars">&#9733;&#9733;&#9733;&#9733;&#9733;</div><p>"EDIT ME - Review text."</p><div class="who">EDIT ME - Name</div></div>
      <div class="review"><div class="stars">&#9733;&#9733;&#9733;&#9733;&#9734;</div><p>"EDIT ME - Review text."</p><div class="who">EDIT ME - Name</div></div>
    </div>
  </div>
</section>
<!-- COPY END -->

</body>
</html>
