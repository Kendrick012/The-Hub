<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Preview: reviews — Truck (Hot Plate)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{ --bg:#201E1B; --bg-alt:#2A2723; --text:#EFE7D8; --text-dim:rgba(239,231,216,0.6); --accent:#E8A93B; --accent-2:#2F6F6E; --line:rgba(239,231,216,0.16); }
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg); color:var(--text); font-family:'Rubik',sans-serif; font-weight:300; line-height:1.6;}
h1,h2,h3{font-family:'Bungee',sans-serif; text-transform:uppercase; font-weight:400;}
.mono{font-family:'Space Mono',monospace;}
a{color:inherit; text-decoration:none;}
.wrap{max-width:1060px; margin:0 auto; padding:0 32px;}

/* COPY START */
.reviews-truck{padding:90px 0;}
.reviews-truck .head{margin-bottom:48px;}
.reviews-truck .head span{font-family:'Space Mono',monospace; font-size:12px; letter-spacing:.2em; color:var(--accent-2); text-transform:uppercase;}
.reviews-truck .head h2{font-size:clamp(28px,4.5vw,46px); margin-top:10px;}
.reviews-truck .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:24px;}
.reviews-truck .review{background:var(--bg-alt); padding:26px 24px; border-radius:6px;}
.reviews-truck .stars{color:var(--accent); letter-spacing:3px; margin-bottom:12px;}
.reviews-truck p{font-size:14px; color:var(--text-dim);}
.reviews-truck .who{margin-top:14px; font-family:'Space Mono',monospace; font-size:12px; color:var(--text);}
@media(max-width:820px){.reviews-truck .grid{grid-template-columns:1fr;}}
/* COPY END */
@media(prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important;}}
</style>
</head>
<body>

<!-- COPY START -->
<section class="reviews-truck" id="reviews">
  <div class="wrap">
    <div class="head"><span>EDIT ME - Eyebrow</span><h2>Reviews</h2></div>
    <div class="grid">
      <div class="review"><div class="stars">&#9733;&#9733;&#9733;&#9733;&#9733;</div><p>"EDIT ME - Review text."</p><div class="who">— EDIT ME - Name</div></div>
      <div class="review"><div class="stars">&#9733;&#9733;&#9733;&#9733;&#9733;</div><p>"EDIT ME - Review text."</p><div class="who">— EDIT ME - Name</div></div>
      <div class="review"><div class="stars">&#9733;&#9733;&#9733;&#9733;&#9734;</div><p>"EDIT ME - Review text."</p><div class="who">— EDIT ME - Name</div></div>
    </div>
  </div>
</section>
<!-- COPY END -->

</body>
</html>
