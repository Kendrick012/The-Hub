<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Preview: hub — Truck (Hot Plate)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{ --bg:#201E1B; --bg-alt:#2A2723; --text:#EFE7D8; --text-dim:rgba(239,231,216,0.6); --accent:#E8A93B; --accent-2:#2F6F6E; --line:rgba(239,231,216,0.16); }
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg); color:var(--text); font-family:'Rubik',sans-serif; font-weight:300; line-height:1.6;}
h1,h2,h3{font-family:'Bungee',sans-serif; text-transform:uppercase; font-weight:400;}
.mono{font-family:'Space Mono',monospace;}
a{color:inherit; text-decoration:none;}
.wrap{max-width:1060px; margin:0 auto; padding:0 32px;}

/* COPY START */
/* One band per business on a hub/homepage. Duplicate the section for each
   business and override the four custom properties inline (see markup) to
   recolor each band. Put an animated ornament (or an image) in .art. */
.hub-band{display:grid; grid-template-columns:1.1fr 0.9fr; gap:50px; align-items:center; padding:80px 8vw; border-top:1px solid var(--line); background:var(--band-bg, var(--bg)); color:var(--band-text, var(--text));}
.hub-band .tag{font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.2em; text-transform:uppercase; margin-bottom:14px; display:inline-block; padding:5px 12px; background:var(--band-accent, var(--accent)); color:var(--band-bg, var(--bg));}
.hub-band h2{font-size:clamp(26px,4.5vw,46px); margin-bottom:14px; line-height:1.05;}
.hub-band p{max-width:420px; margin-bottom:28px; font-size:15.5px; opacity:.7;}
.hub-band .btn{display:inline-block; padding:15px 34px; font-family:'Space Mono',monospace; font-size:13px; letter-spacing:0.08em; text-transform:uppercase; font-weight:700; background:var(--band-accent, var(--accent)); color:var(--band-bg, var(--bg)); border:2px solid var(--band-accent, var(--accent)); transition:transform .2s ease;}
.hub-band .btn:hover{transform:translateY(-3px);}
.hub-band .art{display:flex; justify-content:center;}
@media(max-width:820px){.hub-band{grid-template-columns:1fr;} .hub-band .art{order:-1;}}
/* COPY END */
@media(prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important;}}
</style>
</head>
<body>

<!-- COPY START -->
<section class="hub-band" style="--band-bg:#201E1B; --band-text:#EFE7D8; --band-accent:#E8A93B;">
  <div>
    <span class="tag">EDIT ME - Cuisine / category</span>
    <h2>EDIT ME - Business Name</h2>
    <p>EDIT ME - One or two lines selling this business.</p>
    <a class="btn" href="EDIT-ME-page.html">EDIT ME - Visit Site &rarr;</a>
  </div>
  <div class="art">
    <!-- Paste an ornament from blocks/ornaments/ here (rolling-truck, lantern, wheel...) -->
  </div>
</section>
<!-- COPY END -->

</body>
</html>
