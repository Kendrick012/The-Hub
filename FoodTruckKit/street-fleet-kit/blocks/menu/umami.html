<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Preview: menu — Umami (Night Market)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Antique&family=Manrope:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{ --bg:#191423; --bg-alt:#221B30; --text:#F3EDE4; --text-dim:rgba(243,237,228,0.6); --accent:#E8A05C; --accent-2:#C8462E; --line:rgba(243,237,228,0.14); }
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg); color:var(--text); font-family:'Manrope',sans-serif; font-weight:300; line-height:1.7;}
h1,h2,h3{font-family:'Zen Antique',serif; font-weight:400;}
a{color:inherit; text-decoration:none;}
.wrap{max-width:1060px; margin:0 auto; padding:0 32px;}

/* COPY START */
.menu-umami{padding:90px 0;}
.menu-umami .head{text-align:center; margin-bottom:52px;}
.menu-umami .head span{font-size:12px; letter-spacing:.3em; text-transform:uppercase; color:var(--accent);}
.menu-umami .head h2{font-size:clamp(28px,4vw,44px); margin-top:12px;}
.menu-umami .list{max-width:620px; margin:0 auto;}
.menu-umami .course{text-align:center; font-family:'Zen Antique',serif; color:var(--accent-2); font-size:15px; margin:34px 0 16px;}
.menu-umami .dish{display:flex; justify-content:space-between; align-items:baseline; padding:14px 0; border-bottom:1px solid var(--line); gap:20px;}
.menu-umami .dname{font-family:'Zen Antique',serif; font-size:17px;}
.menu-umami .ddesc{font-size:13px; color:var(--text-dim); margin-top:3px;}
.menu-umami .dprice{color:var(--accent); font-size:15px; white-space:nowrap;}
/* COPY END */
@media(prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important;}}
</style>
</head>
<body>

<!-- COPY START -->
<section class="menu-umami" id="menu">
  <div class="wrap">
    <div class="head"><span>EDIT ME - Eyebrow</span><h2>EDIT ME - Menu title</h2></div>
    <div class="list">
      <div class="course">— EDIT ME - Category —</div>
      <div class="dish"><div><div class="dname">EDIT ME - Item</div><div class="ddesc">EDIT ME - Description.</div></div><div class="dprice">EDIT ME</div></div>
      <div class="dish"><div><div class="dname">EDIT ME - Item</div><div class="ddesc">EDIT ME - Description.</div></div><div class="dprice">EDIT ME</div></div>
      <div class="course">— EDIT ME - Category —</div>
      <div class="dish"><div><div class="dname">EDIT ME - Item</div><div class="ddesc">EDIT ME - Description.</div></div><div class="dprice">EDIT ME</div></div>
    </div>
  </div>
</section>
<!-- COPY END -->

</body>
</html>
