<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Preview: Menu / Listing — Truck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
    --bg:#201E1B; --bg-alt:#2A2723; --text:#EFE7D8; --text-dim:rgba(239,231,216,0.6);
    --accent:#E8A93B; --accent-2:#2F6F6E; --line:rgba(239,231,216,0.16);
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg); color:var(--text); font-family:'Rubik', sans-serif; font-weight:300; line-height:1.6;}
h1,h2,h3{font-family:'Bungee', sans-serif; font-weight:400;}
h1,h2,h3{text-transform:uppercase;}
.mono{font-family:'Space Mono', monospace;}
a{color:inherit; text-decoration:none;}
.wrap{max-width:1080px; margin:0 auto; padding:0 32px;}

/* COPY START */
.menu-truck{padding:100px 0; background:var(--bg-alt);}
.menu-truck .head{margin-bottom:56px;}
.menu-truck .head span{font-family:var(--mono); font-size:12px; letter-spacing:0.2em; color:var(--accent-2); text-transform:uppercase;}
.menu-truck .head h2{font-size:clamp(30px,4.5vw,48px); margin-top:10px;}
.menu-truck .board{background:#181613; border:6px solid #3a352c; border-radius:6px; padding:36px 40px;}
.menu-truck .row{display:flex; justify-content:space-between; align-items:baseline; padding:14px 0; border-bottom:1px dotted rgba(239,231,216,0.25);}
.menu-truck .row:last-child{border-bottom:none;}
.menu-truck .name{font-size:17px; color:var(--text);}
.menu-truck .desc{font-size:13px; color:var(--text-dim); margin-top:4px; text-transform:none; font-family:var(--body-font);}
.menu-truck .price{font-family:var(--mono); color:var(--accent); font-size:16px;}
/* COPY END */
</style>
</head>
<body>

<!-- COPY START -->
<section class="menu-truck" id="menu">
  <div class="wrap">
    <div class="head"><span>EDIT ME - Eyebrow</span><h2>EDIT ME - Section Title</h2></div>
    <div class="board">
      <div class="row"><div><div class="name">EDIT ME - Item</div><div class="desc">EDIT ME - Description.</div></div><div class="price">EDIT ME</div></div>
      <div class="row"><div><div class="name">EDIT ME - Item</div><div class="desc">EDIT ME - Description.</div></div><div class="price">EDIT ME</div></div>
      <div class="row"><div><div class="name">EDIT ME - Item</div><div class="desc">EDIT ME - Description.</div></div><div class="price">EDIT ME</div></div>
    </div>
  </div>
</section>
<!-- COPY END -->

</body>
</html>
