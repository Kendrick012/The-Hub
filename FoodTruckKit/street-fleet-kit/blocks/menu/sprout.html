<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Preview: menu — Sprout (Fresh & Light)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{ --bg:#EAF2E4; --bg-alt:#F6FAF2; --text:#22301F; --text-dim:rgba(34,48,31,0.65); --accent:#3E7C4F; --accent-2:#E86A4E; --line:rgba(34,48,31,0.14); }
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg); color:var(--text); font-family:'Nunito',sans-serif; font-weight:400; line-height:1.65;}
h1,h2,h3{font-family:'Fredoka',sans-serif; font-weight:600;}
a{color:inherit; text-decoration:none;}
.wrap{max-width:1060px; margin:0 auto; padding:0 32px;}

/* COPY START */
.menu-sprout{padding:90px 0;}
.menu-sprout .head{text-align:center; max-width:520px; margin:0 auto 50px;}
.menu-sprout .head span{color:var(--accent-2); font-weight:700; font-size:13px; letter-spacing:.14em; text-transform:uppercase;}
.menu-sprout .head h2{font-size:clamp(28px,4vw,42px); margin-top:10px; color:var(--accent);}
.menu-sprout .head p{color:var(--text-dim); margin-top:10px; font-size:15px;}
.menu-sprout .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:24px;}
.menu-sprout .card{background:var(--bg-alt); border-radius:20px; padding:26px 24px; border:1px solid var(--line); transition:transform .3s ease, box-shadow .3s ease;}
.menu-sprout .card:hover{transform:translateY(-6px); box-shadow:0 16px 34px color-mix(in srgb, var(--text) 10%, transparent);}
.menu-sprout .dot{width:44px; height:44px; border-radius:50%; margin-bottom:16px; display:flex; align-items:center; justify-content:center; font-size:20px; background:color-mix(in srgb, var(--accent) 18%, var(--bg));}
.menu-sprout h3{font-size:18px; margin-bottom:6px;}
.menu-sprout .card p{font-size:13.5px; color:var(--text-dim); margin-bottom:12px;}
.menu-sprout .price{font-weight:800; color:var(--accent);}
@media(max-width:820px){.menu-sprout .grid{grid-template-columns:1fr;}}
/* COPY END */
@media(prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important;}}
</style>
</head>
<body>

<!-- COPY START -->
<section class="menu-sprout" id="menu">
  <div class="wrap">
    <div class="head"><span>EDIT ME - Eyebrow</span><h2>EDIT ME - Menu title</h2><p>EDIT ME - Supporting line.</p></div>
    <div class="grid">
      <div class="card"><div class="dot">&#129388;</div><h3>EDIT ME - Item</h3><p>EDIT ME - Description.</p><div class="price">EDIT ME</div></div>
      <div class="card"><div class="dot">&#127817;</div><h3>EDIT ME - Item</h3><p>EDIT ME - Description.</p><div class="price">EDIT ME</div></div>
      <div class="card"><div class="dot">&#127805;</div><h3>EDIT ME - Item</h3><p>EDIT ME - Description.</p><div class="price">EDIT ME</div></div>
    </div>
  </div>
</section>
<!-- COPY END -->

</body>
</html>
